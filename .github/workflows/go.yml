name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    name: Run Tests & Linters
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

  build:
    name: Build Native Binary (Linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Build Binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o wunschpunsch .
          chmod +x wunschpunsch

      - name: Test Execution
        run: |
          ./wunschpunsch --version || ./wunschpunsch --help || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wunschpunsch-linux-amd64
          path: wunschpunsch

  release:
    name: Build & Publish Release Assets
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Cross-Compile Binaries
        run: |
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o wunschpunsch .
          cp wunschpunsch wunschpunsch-linux-amd64

          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o wunschpunsch-windows-amd64.exe .

          # macOS ARM64 (Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o wunschpunsch-darwin-arm64 .

      - name: Recreate 'latest' Release & Tag
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Удаляем старый релиз и тег "latest" с GitHub, чтобы обнулить таймштамп
          gh release delete latest --yes --cleanup-tag || true

          # 2. Пересоздаем локальный тег "latest" на свежем коммите и пушим его
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push origin refs/tags/latest --force

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          prerelease: false
          make_latest: true
          files: |
            wunschpunsch
            wunschpunsch-linux-amd64
            wunschpunsch-windows-amd64.exe
            wunschpunsch-darwin-arm64
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
